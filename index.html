<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BerdSend - Voye Lajan ak Rechaj Telefòn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 20px;
            color: #334155;
        }
        .container {
            max-width: 500px;
            background: #ffffff;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        h2 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn-next {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }
        .btn-next:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>BerdSend - Transfè & Rechaj</h2>
        
        <div class="form-group">
            <label for="service-type">Chwazi Sèvis la:</label>
            <select id="service-type">
                <option value="topup">Rechaj Telefòn (Mobile Top-Up)</option>
                <option value="transfer">Transfè Lajan</option>
            </select>
        </div>

        <div class="form-group">
            <label for="destination-country">Peyi Destinasyon:</label>
            <select id="destination-country">
                <option value="ht">Ayiti (HT)</option>
                <option value="do">Repiblik Dominikèn (DO)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="phone-number">Nimewo Telefòn Moun k ap resevwa a:</label>
            <input type="text" id="phone-number" placeholder="eg: 16148174311">
        </div>

        <!-- Bouton Suivan ki mennen sou Stripe Checkout -->
        <button class="btn-next" onclick="proceedToStripe()">Suivan (Next) ➔</button>
    </div>

    <script>
        function proceedToStripe() {
            const serviceType = document.getElementById('service-type').value;
            const country = document.getElementById('destination-country').value;
            const phone = document.getElementById('phone-number').value;

            if (!phone) {
                alert("Tanpri antre nimewo telefòn lan anvan ou kontinye.");
                return;
            }

            // Lè nou konekte backend Stripe la, w ap voye enfòmasyon sa yo 
            // pou kreye sesyon an epi redirije kliyan an sou lyen Stripe la.
            alert("Redirije sou Stripe Checkout pou chwazi montan an epi konplete peman an...");
            
            // Egzanp kòd pou rele backend ou a pita:
            // fetch('/create-checkout-session', {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify({ serviceType, country, phone })
            // })
            // .then(res => res.json())
            // .then(data => { window.location.href = data.url; });
        }
    </script>

</body>
</html>
