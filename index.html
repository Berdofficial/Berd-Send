<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">BerdSend - Rechaj Telefòn ak Transfè Lajan</title>
  
  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    .badge-disabled { background-color: #f3f4f6; color: #9ca3af; cursor: not-allowed; }
    .glass-card { background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(241, 245, 249, 0.9)); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-slate-900 font-sans text-slate-800 flex flex-col min-h-screen antialiased">

  <!-- ==================== HEADER / NAVIGATION ==================== -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- Logo -->
      <div class="flex items-center gap-2 sm:gap-3">
        <a href="/" class="flex items-center gap-1.5 sm:gap-2">
          <img src="logo.jpg" alt="BerdSend Logo" class="h-8 w-8 sm:h-10 sm:w-auto rounded-xl object-cover shadow-sm" onerror="this.src='https://via.placeholder.com/40?text=BS'" />
          <span class="text-lg sm:text-2xl font-extrabold text-blue-600 tracking-tight">BerdSend</span>
        </a>
      </div>

      <!-- Navigation Links -->
      <nav class="hidden md:flex items-center gap-8 font-medium text-slate-600">
        <a href="#recharge" id="navRecharge" class="text-blue-600 font-semibold border-b-2 border-blue-600 pb-1">Rechaj Telefòn</a>
        <div class="relative flex items-center gap-1.5 opacity-60 cursor-not-allowed">
          <span id="navTransfer">Transfè Lajan</span>
          <span id="badgeUnavailable" class="bg-amber-100 text-amber-800 text-xs font-semibold px-2 py-0.5 rounded-full">Pako disponib</span>
        </div>
        <a href="#referral" id="navReferral" class="hover:text-blue-600 transition">Pwogram $5 Referal</a>
      </nav>

      <!-- Right Side: Language Selector & Auth -->
      <div class="flex items-center gap-2 sm:gap-4">
        <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-slate-100 text-slate-700 text-xs sm:text-sm font-semibold py-2 px-3 rounded-xl border border-slate-200 outline-none cursor-pointer hover:bg-slate-200 transition">
          <option value="ht">🇭🇹 Kreyòl</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="en">🇺🇸 English</option>
          <option value="es">🇪🇸 Español</option>
          <option value="pt">🇧🇷 Português</option>
        </select>
        <div class="flex items-center gap-3 border-l pl-3 sm:pl-4 border-slate-200">
          <button onclick="alert('Paj enskripsyon ak pwofil ap vini talè!')" id="loginBtn" class="flex items-center gap-1.5 bg-blue-600 text-white px-3.5 py-2 sm:px-5 sm:py-2.5 rounded-xl font-bold text-xs sm:text-sm hover:bg-blue-700 shadow-md shadow-blue-500/20 transition">
            <i data-lucide="user" class="w-4 h-4"></i>
            <span id="loginText">Konekte</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN HERO & FORM SECTION ==================== -->
  <main class="relative py-12 px-4 flex-grow w-full bg-gradient-to-br from-slate-900 via-blue-950 to-indigo-950">
    <div class="max-w-4xl mx-auto relative z-10">
      <div class="text-center mb-8">
        <h1 id="heroTitle" class="text-3xl sm:text-5xl font-extrabold text-white mb-3 tracking-tight">Voye Rechaj Telefòn Nenpòt Ki Lè</h1>
        <p id="heroSubtitle" class="text-slate-300 text-base sm:text-lg max-w-xl mx-auto font-normal">Voye minutes ak data sou pi bon rezo nan Karayib la, Amerik Latin ak Afrik byen rapid.</p>
      </div>

      <div class="glass-card rounded-3xl shadow-2xl border border-white/20 overflow-hidden">
        <div class="p-6 sm:p-10">
          <form id="rechargeForm" onsubmit="handleRechargeSubmit(event)" class="space-y-6">
            
            <!-- Peyi Orijin & Destinasyon -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
              <div>
                <label id="labelOrigin" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Peyi Orijin *</label>
                <select id="originCountry" class="w-full px-4 py-3.5 rounded-2xl border border-slate-300 bg-white font-semibold text-slate-800 outline-none text-base shadow-sm">
                  <option value="US">🇺🇸 Etazini (USD $)</option>
                  <option value="CA">🇨🇦 Kanada (CAD $)</option>
                  <option value="FR">🇫🇷 Lafrans (EUR €)</option>
                  <option value="BR">🇧🇷 Brezil (BRL R$)</option>
                  <option value="HT">🇭🇹 Ayiti (HTG HTG)</option>
                </select>
              </div>
              <div>
                <label id="labelDest" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Peyi Destinasyon *</label>
                <select id="destCountry" onchange="loadReloadlyOperators();" class="w-full px-4 py-3.5 rounded-2xl border border-slate-300 bg-white font-bold text-blue-600 outline-none text-base shadow-sm">
                  <option value="HT" selected>🇭🇹 Ayiti (+509)</option>
                  <option value="DO">🇩🇴 Repiblik Dominiken (+1)</option>
                  <option value="JM">🇯🇲 Jamayik (+1)</option>
                  <option value="BR">🇧🇷 Brezil (+55)</option>
                  <option value="CL">🇨🇱 Chili (+56)</option>
                  <option value="MX">🇲🇽 Meksik (+52)</option>
                  <option value="CO">🇨🇴 Kolonbi (+57)</option>
                </select>
              </div>
            </div>

            <!-- Nimewo Telefòn & Operatè -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
              <div>
                <label id="labelPhone" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Nimewo Telefòn *</label>
                <input type="tel" id="phoneNumber" required placeholder="37000000" oninput="autoDetectOperator()" class="w-full px-4 py-3.5 rounded-2xl border border-slate-300 bg-white text-lg font-mono outline-none shadow-sm" />
                <span id="autoDetectStatus" class="text-xs text-blue-600 font-medium mt-1 block"></span>
              </div>
              <div>
                <label id="labelOperator" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Chwazi Operatè a *</label>
                <select id="operatorSelect" onchange="renderOperatorOptions()" class="w-full px-4 py-3.5 rounded-2xl border border-slate-300 bg-white font-medium text-slate-800 outline-none text-base shadow-sm">
                  <option value="">Ap chaje operatè yo...</option>
                </select>
              </div>
            </div>

            <!-- Montan Rechaj -->
            <div>
              <label id="labelAmount" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Chwazi Montan / Pake Rechaj la *</label>
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-3" id="amountButtonsContainer"></div>
              <input type="hidden" id="selectedAmount" value="5" />
            </div>

            <!-- Bouton Peye -->
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-4 rounded-2xl shadow-xl transition flex items-center justify-center gap-2 text-lg">
              <span id="btnSubmitText">Peye & Voye Rechaj Kounye A</span>
              <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- ==================== JAVASCRIPT ==================== -->
  <script>
    lucide.createIcons();

    let currentOperatorsList = [];
    let autoDetectTimer = null;

    // TRADIKSYON LANG (Multi-language Support)
    const translations = {
      ht: {
        title: "BerdSend - Rechaj Telefòn ak Transfè Lajan",
        navRecharge: "Rechaj Telefòn",
        navTransfer: "Transfè Lajan",
        navReferral: "Pwogram $5 Referal",
        loginText: "Konekte",
        heroTitle: "Voye Rechaj Telefòn Nenpòt Ki Lè",
        heroSubtitle: "Voye minutes ak data sou pi bon rezo yo byen rapid.",
        labelOrigin: "Peyi Orijin *",
        labelDest: "Peyi Destinasyon *",
        labelPhone: "Nimewo Telefòn *",
        labelOperator: "Chwazi Operatè a *",
        labelAmount: "Chwazi Montan / Pake Rechaj la *",
        btnSubmitText: "Peye & Voye Rechaj Kounye A"
      },
      fr: {
        title: "BerdSend - Recharge Téléphonique et Transfert d'Argent",
        navRecharge: "Recharge Téléphonique",
        navTransfer: "Transfert d'Argent",
        navReferral: "Programme $5 Parrainage",
        loginText: "Se connecter",
        heroTitle: "Envoyez une Recharge Téléphonique à Tout Moment",
        heroSubtitle: "Envoyez des minutes et données rapidement sur les meilleurs réseaux.",
        labelOrigin: "Pays d'Origine *",
        labelDest: "Pays de Destination *",
        labelPhone: "Numéro de Téléphone *",
        labelOperator: "Choisir l'Opérateur *",
        labelAmount: "Choisir le Montant / Forfait *",
        btnSubmitText: "Payer & Envoyer la Recharge Maintenant"
      },
      en: {
        title: "BerdSend - Mobile Top-up & Money Transfer",
        navRecharge: "Mobile Top-up",
        navTransfer: "Money Transfer",
        navReferral: "$5 Referral Program",
        loginText: "Login",
        heroTitle: "Send Mobile Top-ups Anytime",
        heroSubtitle: "Send airtime and data instantly to top mobile networks.",
        labelOrigin: "Origin Country *",
        labelDest: "Destination Country *",
        labelPhone: "Phone Number *",
        labelOperator: "Select Operator *",
        labelAmount: "Select Amount / Package *",
        btnSubmitText: "Pay & Send Top-up Now"
      },
      es: {
        title: "BerdSend - Recarga Móvil y Transferencia de Dinero",
        navRecharge: "Recarga Móvil",
        navTransfer: "Transferencia de Dinero",
        navReferral: "Programa de Referidos $5",
        loginText: "Iniciar sesión",
        heroTitle: "Envia Recargas Móviles en Cualquier Momento",
        heroSubtitle: "Envia minutos y datos al instante a las mejores redes.",
        labelOrigin: "País de Origen *",
        labelDest: "País de Destino *",
        labelPhone: "Número de Teléfono *",
        labelOperator: "Seleccionar Operador *",
        labelAmount: "Seleccionar Monto / Paquete *",
        btnSubmitText: "Pagar y Enviar Recarga Ahora"
      },
      pt: {
        title: "BerdSend - Recarga Celular e Transferência de Dinheiro",
        navRecharge: "Recarga Celular",
        navTransfer: "Transferência de Dinheiro",
        navReferral: "Programa de Indicação $5",
        loginText: "Entrar",
        heroTitle: "Envie Recargas Celulares a Qualquer Momento",
        heroSubtitle: "Envie créditos e dados instantaneamente para as melhores redes.",
        labelOrigin: "País de Origem *",
        labelDest: "País de Destino *",
        labelPhone: "Número de Telefone *",
        labelOperator: "Selecionar Operadora *",
        labelAmount: "Selecionar Valor / Pacote *",
        btnSubmitText: "Pagar e Enviar Recarga Agora"
      }
    };

    function changeLanguage(lang) {
      const t = translations[lang] || translations['ht'];
      document.getElementById('pageTitle').innerText = t.title;
      document.getElementById('navRecharge').innerText = t.navRecharge;
      document.getElementById('navTransfer').innerText = t.navTransfer;
      document.getElementById('navReferral').innerText = t.navReferral;
      document.getElementById('loginText').innerText = t.loginText;
      document.getElementById('heroTitle').innerText = t.heroTitle;
      document.getElementById('heroSubtitle').innerText = t.heroSubtitle;
      document.getElementById('labelOrigin').innerText = t.labelOrigin;
      document.getElementById('labelDest').innerText = t.labelDest;
      document.getElementById('labelPhone').innerText = t.labelPhone;
      document.getElementById('labelOperator').innerText = t.labelOperator;
      document.getElementById('labelAmount').innerText = t.labelAmount;
      document.getElementById('btnSubmitText').innerText = t.btnSubmitText;
    }

    // CHAJE OPERATÈ RELOADLY YO POU TOUT PEYI
    async function loadReloadlyOperators() {
      const countryCode = document.getElementById('destCountry').value;
      const opSelect = document.getElementById('operatorSelect');
      opSelect.innerHTML = '<option value="">Ap chaje operatè yo...</option>';

      try {
        const res = await fetch(`/api/reloadly?action=getOperators&countryCode=${countryCode}`);
        const data = await res.json();
        
        if (Array.isArray(data) && data.length > 0) {
          currentOperatorsList = data;
          opSelect.innerHTML = '';
          data.forEach(op => {
            const opt = document.createElement('option');
            opt.value = op.operatorId || op.id;
            opt.textContent = op.name;
            opSelect.appendChild(opt);
          });
          renderOperatorOptions();
        } else {
          fallbackOperators(countryCode);
        }
      } catch (err) {
        fallbackOperators(countryCode);
      }
    }

    // LIST OPERATÈ FALLBACK POU TOUT PEYI POU PA GEN BLOKAJS
    function fallbackOperators(country) {
      const opSelect = document.getElementById('operatorSelect');
      opSelect.innerHTML = '';
      
      const defaultOperators = {
        'HT': [{id: 1, name: 'Digicel Haiti'}, {id: 2, name: 'Natcom Haiti'}],
        'DO': [{id: 3, name: 'Claro Dominican Republic'}, {id: 4, name: 'Altice Dominican Republic'}, {id: 5, name: 'Viva'}],
        'JM': [{id: 6, name: 'Digicel Jamaica'}, {id: 7, name: 'Flow Jamaica'}],
        'BR': [{id: 8, name: 'Vivo Brazil'}, {id: 9, name: 'TIM Brazil'}, {id: 10, name: 'Claro Brazil'}],
        'CL': [{id: 11, name: 'Entel Chile'}, {id: 12, name: 'Movistar Chile'}, {id: 13, name: 'WOM Chile'}],
        'MX': [{id: 14, name: 'Telcel Mexico'}, {id: 15, name: 'Movistar Mexico'}, {id: 16, name: 'AT&T Mexico'}],
        'CO': [{id: 17, name: 'Claro Colombia'}, {id: 18, name: 'Movistar Colombia'}, {id: 19, name: 'Tigo Colombia'}]
      };

      const list = defaultOperators[country] || [{id: 0, name: 'Operatè Jeneral ' + country}];
      list.forEach(op => {
        const opt = document.createElement('option');
        opt.value = op.id;
        opt.textContent = op.name;
        opSelect.appendChild(opt);
      });
      renderOperatorOptions();
    }

    function renderOperatorOptions() {
      const container = document.getElementById('amountButtonsContainer');
      container.innerHTML = '';
      const amounts = [5, 10, 15, 20, 25, 50];
      amounts.forEach((amt, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `py-3 px-4 rounded-xl border border-slate-200 bg-white hover:border-blue-600 font-bold text-slate-800 transition shadow-sm ${idx === 0 ? 'border-blue-600 bg-blue-50/50' : ''}`;
        btn.textContent = `$${amt} USD`;
        btn.onclick = () => {
          document.querySelectorAll('#amountButtonsContainer button').forEach(b => b.classList.remove('border-blue-600', 'bg-blue-50/50'));
          btn.classList.add('border-blue-600', 'bg-blue-50/50');
          document.getElementById('selectedAmount').value = amt;
        };
        container.appendChild(btn);
      });
    }

    function autoDetectOperator() {
      clearTimeout(autoDetectTimer);
      const phone = document.getElementById('phoneNumber').value.trim();
      const countryCode = document.getElementById('destCountry').value;
      const statusSpan = document.getElementById('autoDetectStatus');

      if (phone.length < 7) {
        statusSpan.textContent = '';
        return;
      }

      autoDetectTimer = setTimeout(async () => {
        statusSpan.textContent = 'Ape detekte operatè...';
        try {
          const res = await fetch(`/api/reloadly?action=autoDetect&phone=${phone}&countryCode=${countryCode}`);
          const op = await res.json();
          if (op && (op.operatorId || op.id)) {
            document.getElementById('operatorSelect').value = op.operatorId || op.id;
            statusSpan.textContent = `Operatè detekte: ${op.name}`;
          } else {
            statusSpan.textContent = '';
          }
        } catch (e) {
          statusSpan.textContent = '';
        }
      }, 500);
    }

    // FONKSYON POU VOYE SOU REDERIKYON CHECKOUT SQUARE
    async function handleRechargeSubmit(event) {
      event.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnSubmitText');
      
      submitBtn.disabled = true;
      btnText.innerText = "N ap prepare paj peyman an...";

      const originCountry = document.getElementById('originCountry').value;
      const destCountry = document.getElementById('destCountry').value;
      const phoneNumber = document.getElementById('phoneNumber').value.trim();
      const operatorId = document.getElementById('operatorSelect').value;
      const amount = document.getElementById('selectedAmount').value;

      if (!phoneNumber) {
        alert("Tanpri antre yon nimewo telefòn ki valid.");
        submitBtn.disabled = false;
        btnText.innerText = translations[document.getElementById('langSelect').value]?.btnSubmitText || "Peye & Voye Rechaj Kounye A";
        return;
      }

      try {
        const response = await fetch('/api/square', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            phoneNumber,
            operatorId,
            amount,
            originCountry,
            destCountry
          })
        });

        const data = await response.json();

        if (data.checkoutUrl) {
          window.location.href = data.checkoutUrl;
        } else {
          alert("Gen yon pwoblèm ak sèvis peyman an: " + (data.error || "Eseye ankò."));
          submitBtn.disabled = false;
          btnText.innerText = translations[document.getElementById('langSelect').value]?.btnSubmitText || "Peye & Voye Rechaj Kounye A";
        }
      } catch (error) {
        console.error("Erè peyman:", error);
        alert("Erè nan koneksyon ak sèvè peyman an.");
        submitBtn.disabled = false;
        btnText.innerText = translations[document.getElementById('langSelect').value]?.btnSubmitText || "Peye & Voye Rechaj Kounye A";
      }
    }

    // Chaje operatè yo tou swit lè paj la fini chaje
    window.addEventListener('DOMContentLoaded', loadReloadlyOperators);
  </script>
</body>
</html>
