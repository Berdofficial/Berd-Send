<!DOCTYPE html>
<html lang="ht" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BerdSend</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin: auto;
        }
        .lang-selector {
            text-align: right;
            margin-bottom: 15px;
        }
        .lang-selector select {
            padding: 5px;
            border-radius: 4px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Chwa Lang -->
    <div class="lang-selector">
        <label for="langSelect" style="display:inline; font-size: 14px;" id="lblLang">Lang:</label>
        <select id="langSelect" onchange="changeLanguage()">
            <option value="ht">Kreyòl</option>
            <option value="en">English</option>
            <option value="pt">Português</option>
        </select>
    </div>

    <h2 id="formTitle">Fòmilè Adrès Kliyan</h2>

    <form>
        <!-- Lari -->
        <div class="form-group">
            <label for="street" id="lblStreet">Lari:</label>
            <input type="text" id="street" placeholder="Antre lari w la">
        </div>

        <!-- Vil -->
        <div class="form-group">
            <label for="city" id="lblCity">Vil:</label>
            <input type="text" id="city" placeholder="Antre vil ou a">
        </div>

        <!-- Depatman / Eta -->
        <div class="form-group">
            <label for="state" id="lblState">Depatman:</label>
            <input type="text" id="state" placeholder="Antre depatman w lan">
        </div>
    </form>
</div>

<script>
    // Mo tradiksyon yo pou chak lang
    const translations = {
        ht: {
            formTitle: "Fòmilè Adrès Kliyan",
            lblLang: "Lang:",
            lblStreet: "Lari:",
            streetPlaceholder: "Antre lari w la",
            lblCity: "Vil:",
            cityPlaceholder: "Antre vil ou a",
            lblState: "Depatman:",
            statePlaceholder: "Antre depatman w lan"
        },
        en: {
            formTitle: "Customer Address Form",
            lblLang: "Language:",
            lblStreet: "Street:",
            streetPlaceholder: "Enter your street",
            lblCity: "City:",
            cityPlaceholder: "Enter your city",
            lblState: "State / Department:",
            statePlaceholder: "Enter your department/state"
        },
        pt: {
            formTitle: "Formulário de Endereço do Cliente",
            lblLang: "Idioma:",
            lblStreet: "Rua:",
            streetPlaceholder: "Digite sua rua",
            lblCity: "Cidade:",
            cityPlaceholder: "Digite sua cidade",
            lblState: "Estado / Departamento:",
            statePlaceholder: "Digite seu departamento/estado"
        }
    };

    function changeLanguage() {
        const selectedLang = document.getElementById('langSelect').value;
        
        // Chanje lang HTML la
        document.getElementById('htmlRoot').setAttribute('lang', selectedLang);

        // Mete tèks yo ajou baze sou lang ki chwazi a
        document.getElementById('formTitle').innerText = translations[selectedLang].formTitle;
        document.getElementById('lblLang').innerText = translations[selectedLang].lblLang;
        
        document.getElementById('lblStreet').innerText = translations[selectedLang].lblStreet;
        document.getElementById('street').setAttribute('placeholder', translations[selectedLang].streetPlaceholder);
        
        document.getElementById('lblCity').innerText = translations[selectedLang].lblCity;
        document.getElementById('city').setAttribute('placeholder', translations[selectedLang].cityPlaceholder);
        
        document.getElementById('lblState').innerText = translations[selectedLang].lblState;
        document.getElementById('state').setAttribute('placeholder', translations[selectedLang].statePlaceholder);
    }
</script>

</body>
</html>
