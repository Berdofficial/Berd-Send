<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BerdSend - Transferência e Recarga de Celular</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 650px;
            margin: 30px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #0066cc;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .banner {
            background-color: #fff3cd;
            color: #856404;
            padding: 12px;
            border: 1px solid #ffeeba;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #218838;
        }
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ================= PATI 1: ENKRIPSYON AK VERIFIKASYON ================= -->
        <div id="registration-section">
            <div class="banner">
                ⚠️ Ou dwe enskri epi pase verifikasyon idantite a anvan ou jwenn aksè nan sèvis yo.
            </div>
            <h2>BerdSend - Enskripsyon & Verifikasyon Idantite</h2>
            
            <form id="verifyForm" onsubmit="handleRegistration(event)">
                <div class="form-group">
                    <label for="fullname">Non konplè:</label>
                    <input type="text" id="fullname" placeholder="Antre non ak siyati w" required>
                </div>
                <div class="form-group">
                    <label for="email">Imèl:</label>
                    <input type="email" id="email" placeholder="eg: ou@gmail.com" required>
                </div>
                <div class="form-group">
                    <label for="id-number">Nimewo Idantifikasyon (ID, Passaporte oswa NIF):</label>
                    <input type="text" id="id-number" placeholder="eg: P1234567 oswa NIF w..." required>
                </div>
                <div class="form-group">
                    <label for="id-file">Voye Foto Idantifikasyon / Dokiman:</label>
                    <input type="file" id="id-file" required>
                </div>
                <button type="submit" class="btn">Konfime Enskripsyon epi Pase nan Sèvis yo 🚀</button>
            </form>
        </div>

        <!-- ================= PATI 2: PAJ SÈVIS (TRANSFÈ AK RECHAJ MOBIL) ================= -->
        <div id="service-section" class="hidden">
            <h2>Paj Sèvis BerdSend</h2>
            <p style="text-align: center; color: #28a745; font-weight: bold;">✅ Kont ou verifye avèk siksè!</p>

            <!-- Bouton Chwa Sèvis yo -->
            <div class="tab-buttons">
                <button type="button" class="tab-btn">📱 Recarga de Celular</button>
                <button type="button" class="tab-btn" style="background: #6c757d;">💸 Transferência</button>
            </div>

            <form id="serviceForm">
                <div class="form-group">
                    <label>País de envio:</label>
                    <select>
                        <option>🇺🇸 Etazini (USD - $)</option>
                        <option>🇧🇷 Brezil (BRL - R$)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>País de destino:</label>
                    <select>
                        <option>🇭🇹 Ayiti (HTG - G)</option>
                        <option>🇩🇴 Repiblik Dominikèn (DOP)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Selecione a Operadora:</label>
                    <select>
                        <option>📶 Digicel (Ayiti - Dirèk)</option>
                        <option>📶 Natcom (Ayiti - Dirèk)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Valor a enviar ($):</label>
                    <input type="number" value="100">
                </div>

                <div class="form-group">
                    <label>Endereço Completo do Destinatário:</label>
                    <input type="text" placeholder="Digite rua, cidade, estado/departamento...">
                </div>

                <div class="form-group">
                    <label>Número de telefone do destinatário:</label>
                    <input type="text" placeholder="+509 ...">
                </div>

                <div class="form-group">
                    <label>Código Promocional (Apenas Recarga - $5 de Desconto):</label>
                    <input type="text" placeholder="eg: BERD5 oswa FRIEND10">
                </div>

                <button type="button" class="btn" onclick="alert('Tranzaksyon voye avèk siksè!')">Enviar Recarga Agora 🚀</button>
            </form>
        </div>

    </div>

    <script>
        function handleRegistration(event) {
            event.preventDefault(); // Anpeche paj la rafrechi
            
            // Kache seksyon enskripsyon an
            document.getElementById('registration-section').classList.add('hidden');
            
            // Montre seksyon sèvis la (Transfè ak Rechaj)
            document.getElementById('service-section').classList.remove('hidden');
        }
    </script>

</body>
</html>
