<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BerdSend - Transfert d'Argent & Recharge Mobile</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Web Payments SDK -->
    <script type="text/javascript" src="https://web.squarecdn.com/v1/square.js"></script>
    <style>
        .active-tab {
            border-bottom: 3px solid #2563eb;
            color: #2563eb;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- HEADER / NAVIGATION KONPLÈ AK SELEKSYON LANG -->
    <header class="bg-white shadow-sm border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <!-- LOGO -->
            <div class="flex items-center gap-2">
                <img src="logo.jpg" alt="BerdSend Logo" class="h-10 w-auto object-contain" id="main-logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/120x40?text=BerdSend';">
            </div>
            
            <!-- OPTIONS & LOGIN BUTTON -->
            <div class="flex items-center gap-3">
                <!-- SELEKSYON LANG -->
                <div class="relative">
                    <select id="language-select" onchange="changeLanguage(this.value)" class="bg-slate-100 text-slate-700 text-xs font-semibold py-2 px-3 rounded-xl border-none outline-none cursor-pointer hover:bg-slate-200 transition">
                        <option value="ht">🇭🇹 Kreyòl</option>
                        <option value="fr">🇫🇷 Français</option>
                        <option value="en">🇺🇸 English</option>
                        <option value="pt">🇧🇷 Pt-BR</option>
                    </select>
                </div>

                <!-- BUTTON KONEKTE / LOGIN -->
                <button class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-xl transition shadow-sm">
                    <i data-lucide="user" class="w-4 h-4"></i>
                    <span>Konekte (Login)</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="max-w-2xl mx-auto px-4 py-8 w-full flex-grow">
        
        <!-- CARD MAIN WRAPPER -->
        <div class="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
            
            <!-- SERVICES NAVIGATION TABS (TRANSFÈ AK RECHAJ ANSANM) -->
            <div class="flex border-b border-slate-200 bg-slate-50/50">
                <button id="tab-transfer" onclick="switchService('transfer')" class="flex-1 py-4 text-center text-sm font-semibold flex items-center justify-center gap-2 active-tab transition">
                    <i data-lucide="send" class="w-4 h-4"></i>
                    <span>Transfè Lajan</span>
                </button>
                <button id="tab-recharge" onclick="switchService('recharge')" class="flex-1 py-4 text-center text-sm font-semibold text-slate-500 flex items-center justify-center gap-2 hover:text-blue-600 transition">
                    <i data-lucide="smartphone" class="w-4 h-4"></i>
                    <span>Rechaj Mobil</span>
                </button>
            </div>

            <div class="p-6 md:p-8">
                <!-- FORMULARIO DE TRANSACCIÓN -->
                <form id="payment-form" onsubmit="handleProcessPayment(event)">
                    
                    <!-- DYNAMIC SERVICE FIELDS -->
                    <div id="service-fields" class="space-y-4 mb-6">
                        <!-- Default: Transfer Fields -->
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Peyi Destinatè *</label>
                            <select class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-base bg-white">
                                <option value="HT">Haïti (HTG / USD)</option>
                                <option value="DR">République Dominicaine (DOP)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Montan pou voye (USD) *</label>
                            <input type="number" required min="1" placeholder="0.00" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-base">
                        </div>
                    </div>

                    <!-- MANDATORY EMAIL COLLECTION FOR TRANSACTION -->
                    <div class="mb-6">
                        <label class="block text-sm font-semibold text-slate-700 mb-1">
                            Adrès Email (Obligatwa pou resevwa resi a) *
                        </label>
                        <input type="email" id="customer-email" required placeholder="egzamp@gmail.com" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-base">
                    </div>

                    <!-- PAYMENT SECTION (SAN MO SQUARE LA) -->
                    <div class="border-t border-slate-200 pt-6 space-y-4">
                        <label class="block text-sm font-semibold text-slate-700 flex items-center gap-2">
                            <i data-lucide="credit-card" class="w-4 h-4 text-blue-600"></i>
                            <span>Enfòmasyon Peman Kat Kredi *</span>
                        </label>

                        <!-- CHAN POU NON KI SOU KAT LA -->
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Non ki sou Kat la *</label>
                            <input type="text" id="cardholder-name" required placeholder="Egz. Jean Dupont" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-base bg-white">
                        </div>

                        <!-- FÒM KAT LA -->
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Nimewo Kat & Detay *</label>
                            <div id="card-container" class="min-h-[90px] border border-slate-300 rounded-xl p-3 bg-white"></div>
                        </div>

                        <div id="payment-status-container" class="text-xs font-semibold"></div>
                    </div>

                    <!-- SUBMIT BUTTON -->
                    <button id="card-button" type="submit" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl transition flex items-center justify-center gap-2">
                        <i data-lucide="lock" class="w-5 h-5"></i>
                        <span>Peye nan Fason Ki Ansekirite</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- BANNER PWOMOSYON (5$ POUR CHAK ENVITASYON) -->
        <div class="mt-8 bg-gradient-to-r from-blue-500 to-indigo-600 rounded-2xl p-6 text-white shadow-md flex items-center justify-between">
            <div>
                <h3 class="font-bold text-lg mb-1">Envite yon zanmi, genyen $5!</h3>
                <p class="text-xs text-blue-100">W ap resevwa $5 pou chak envitasyon yon nouvo moun kòmanse sèvi ak BerdSend.</p>
            </div>
            <button class="bg-white text-blue-600 font-bold text-xs px-4 py-2.5 rounded-xl shadow hover:bg-slate-100 transition whitespace-nowrap">
                Pataje Lyen
            </button>
        </div>
    </main>

    <!-- BANNER COOKIES -->
    <div id="cookies-banner" class="fixed bottom-0 left-0 right-0 bg-slate-900 text-white p-4 shadow-2xl z-50 flex flex-col md:flex-row items-center justify-between gap-4 text-xs">
        <p class="text-slate-300">
            Nou sèvi ak cookies pou amelyore eksperyans ou ak asire sekirite tranzaksyon yo sou BerdSend.
        </p>
        <div class="flex items-center gap-3">
            <button onclick="acceptCookies()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg transition">
                Aksepte Tout
            </button>
            <button onclick="acceptCookies()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold px-4 py-2 rounded-lg transition">
                Fèmen
            </button>
        </div>
    </div>

    <!-- FOOTER KONPLÈ -->
    <footer class="bg-white border-t border-slate-200 py-8 mt-12 text-slate-500 text-xs">
        <div class="max-w-4xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <p>&copy; 2026 BerdSend LLC. Tout dwa rezève.</p>
            <div class="flex items-center gap-6">
                <a href="#" class="hover:text-blue-600 transition">Kondisyon Sèvis</a>
                <a href="#" class="hover:text-blue-600 transition">Politik Konfidansyalite</a>
                <a href="#" class="hover:text-blue-600 transition">Sipò / Kontak</a>
            </div>
        </div>
    </footer>

    <!-- SCRIPT CONFIGURATION AND LOGIC -->
    <script>
        // INITIALIZE LUCIDE ICONS
        lucide.createIcons();

        // CREDENTIALS INTEGRATION (PRODUCTION)
        const appId = 'sq0idp-x8g0V6Q_HZZKVYFw8eVV2w';
        const locationId = 'LB2PZD56256TT';

        let card;

        // INITIALIZE PAYMENTS SDK
        async function initializePayment() {
            if (!window.Square) {
                console.error("SDK pa chaje.");
                return;
            }

            try {
                const payments = window.Square.payments(appId, locationId);
                card = await payments.card();
                await card.attach('#card-container');
            } catch (e) {
                console.error('Erè nan chajman fòm peman an:', e);
                document.getElementById('payment-status-container').innerText = 'Erè nan chaje fòm kat la. Tanpri reload paj la.';
                document.getElementById('payment-status-container').classList.add('text-red-500');
            }
        }

        // SWITCH TABS (TRANSFÈ VS RECHAJ)
        function switchService(service) {
            const tabTransfer = document.getElementById('tab-transfer');
            const tabRecharge = document.getElementById('tab-recharge');
            const serviceFields = document.getElementById('service-fields');

            if (service === 'transfer') {
                tabTransfer.className = "flex-1 py-4 text-center text-sm font-semibold flex items-center justify-center gap-2 active-tab transition";
                tabRecharge.className = "flex-1 py-4 text-center text-sm font-semibold text-slate-500 flex items-center justify-center gap-2 hover:text-blue-600 transition";
                
                serviceFields.innerHTML = `
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Peyi Destinatè *</label>
                        <select class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-base bg-white">
                            <option value="HT">Haïti (HTG / USD)</option>
                            <option value="DR">République Dominicaine (DOP)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Montan pou voye (USD) *</label>
                        <input type="number" required min="1" placeholder="0.00" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-base">
                    </div>
                `;
            } else {
                tabRecharge.className = "flex-1 py-4 text-center text-sm font-semibold text-blue-600 flex items-center justify-center gap-2 active-tab transition";
                tabTransfer.className = "flex-1 py-4 text-center text-sm font-semibold text-slate-500 flex items-center justify-center gap-2 hover:text-blue-600 transition";

                serviceFields.innerHTML = `
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Konpayi Telefòn *</label>
                        <select class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-base bg-white">
                            <option value="digicel">Digicel Haïti</option>
                            <option value="natcom">Natcom Haïti</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Nimewo Telefòn *</label>
                        <input type="tel" required placeholder="+509 XXXX XXXX" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-base">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Montan Rechaj ($) *</label>
                        <input type="number" required min="1" placeholder="5.00" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-base">
                    </div>
                `;
            }
            lucide.createIcons();
        }

        // HANDLE COOKIES BANNER
        function acceptCookies() {
            document.getElementById('cookies-banner').style.display = 'none';
        }

        // HANDLE LANGUAGE SWITCH
        function changeLanguage(lang) {
            console.log("Langue sélectionnée:", lang);
        }

        // HANDLE PROCESS PAYMENT
        async function handleProcessPayment(event) {
            event.preventDefault();
            const statusContainer = document.getElementById('payment-status-container');
            const cardholderName = document.getElementById('cardholder-name').value;
            
            statusContainer.innerText = 'N ap trete peman an...';
            statusContainer.className = 'text-xs font-semibold text-blue-600';

            try {
                const result = await card.tokenize();
                if (result.status === 'OK') {
                    console.log('Token peman kreye avèk siksè:', result.token);
                    console.log('Non ki sou kat la:', cardholderName);
                    
                    statusContainer.innerText = 'Peman an pase avèk siksè!';
                    statusContainer.className = 'text-xs font-semibold text-green-600';
                } else {
                    let errorMessage = `Echèk peman: ${result.errors[0].message}`;
                    statusContainer.innerText = errorMessage;
                    statusContainer.className = 'text-xs font-semibold text-red-600';
                }
            } catch (e) {
                console.error(e);
                statusContainer.innerText = 'Gen yon erè ki rive pandan tretman an.';
                statusContainer.className = 'text-xs font-semibold text-red-600';
            }
        }

        // LOAD WHEN DOM IS READY
        document.addEventListener('DOMContentLoaded', initializePayment);
    </script>
</body>
</html>
