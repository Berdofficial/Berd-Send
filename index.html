<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BerdSend - Voye Lajan ak Rechaj Telefòn</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f7fc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Header ki kenbe tout eleman yo sou yon sèl liy orizontal */
        .header-container {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .logo-area img {
            height: 40px;
            object-fit: contain;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: nowrap;
        }

        .language-select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #fff;
            font-size: 14px;
        }

        .connect-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }

        .menu-btn {
            background: none;
            border: 1px solid #ccc;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        /* Rès kòd pou pwomosyon ak fòm lan */
        .promo-banner {
            width: 100%;
            max-width: 600px;
            background: linear-gradient(135deg, #0056b3, #2575fc);
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .main-card {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

    <!-- Header sou yon sèl liy -->
    <header class="header-container">
        <div class="logo-area">
            <img src="logo.jpg" alt="BerdSend Logo">
        </div>
        <div class="nav-controls">
            <select class="language-select">
                <option value="ht">🇭🇹 Kreyòl</option>
                <option value="en">🇺🇸 English</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="pt">🇧🇷 Português</option>
            </select>
            <button class="connect-btn">
                <span>👤</span> Konekte
            </button>
            <button class="menu-btn">☰</button>
        </div>
    </header>

    <!-- Seksyon Pwomosyon -->
    <div class="promo-banner">
        <h3>🎁 Pwomosyon 7 Premye Jou yo: $10</h3>
        <p>Nan premye 7 jou yo w ap jwenn $10 pa envitasyon, apre sa $5 pa envitasyon!</p>
    </div>

    <!-- Kat prensipal pou voye lajan / rechaj -->
    <div class="main-card">
        <!-- Kontni fòm lan ka vini la -->
    </div>

</body>
</html>
