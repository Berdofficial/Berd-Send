<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BerdSend - Money Transfer & Mobile Top-Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f0f4f8; color: #333; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 30px 20px; }
        .wrapper { width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; }
        
        .card { background: #fff; width: 100%; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2, h3, h4 { color: #111; margin-bottom: 15px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #0066cc; }
        
        .btn { background: #0066cc; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; }
        .btn:hover { background: #0052a3; }
        .btn-danger { background: #ff4d4d; }
        .btn-danger:hover { background: #cc0000; }
        .btn-secondary { background: #ccc; color: #333; }
        
        #deleteReasonContainer { display: none; margin-top: 15px; padding: 15px; background: #fff5f5; border: 1px solid #ffcccc; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="wrapper">
        
        <!-- Seksyon Koneksyon (Login) -->
        <div class="card" id="loginCard">
            <h2>Konekte w</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Imèl</label>
                    <input type="email" id="loginEmail" required placeholder="antre imèl ou...">
                </div>
                <div class="form-group">
                    <label>Modpas</label>
                    <input type="password" id="loginPassword" required placeholder="antre modpas ou...">
                </div>
                <button type="submit" class="btn">Konekte</button>
            </form>
        </div>

        <!-- Seksyon Anrejistreman (Sign Up) - Anpeche Plizyè Kont ak Menm Imèl -->
        <div class="card" id="registerCard">
            <h2>Kreye yon Kont</h2>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Non Konplè</label>
                    <input type="text" id="regName" required placeholder="non ou...">
                </div>
                <div class="form-group">
                    <label>Imèl</label>
                    <input type="email" id="regEmail" required placeholder="imèl ou...">
                </div>
                <div class="form-group">
                    <label>Modpas</label>
                    <input type="password" id="regPassword" required placeholder="modpas ou...">
                </div>
                <button type="submit" class="btn" style="background: #28a745;">Anrejistre</button>
            </form>
        </div>

        <!-- Seksyon Paramèt Kont & Zòn Danje (Edisyon ak Sipresyon) -->
        <div class="card" id="accountSettingsCard" style="display: none;">
            <h3>Paramèt Kont Mwen</h3>
            
            <form id="editProfileForm">
                <div class="form-group">
                    <label>Non Konplè:</label>
                    <input type="text" id="updateName" required>
                </div>
                <div class="form-group">
                    <label>Imèl (Pa ka chanje):</label>
                    <input type="email" id="updateEmail" readonly style="background: #f5f5f5;">
                </div>
                <button type="button" class="btn" onclick="saveProfileChanges()">Mete Enfòmasyon Yo Jou</button>
            </form>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

            <div>
                <h4 style="color: #ff4d4d;">Zòn Danje</h4>
                <p style="color: #666; font-size: 0.85rem; margin-bottom: 10px;">Lè ou siprime kont ou, tout done ou yo ap efase nèt.</p>
                <button type="button" class="btn btn-danger" onclick="showDeleteForm()">Siprime Kont Mwen</button>
            </div>

            <!-- Fòmilè Kesyon pou Sipresyon Kont -->
            <div id="deleteReasonContainer">
                <h4 style="color: #cc0000; margin-bottom: 8px;">Poukisa w ap kite nou?</h4>
                <p style="font-size: 0.8rem; color: #555; margin-bottom: 10px;">Tanpri reponn kesyon sa yo pou ede nou:</p>
                
                <div class="form-group">
                    <label>1. Rezon prensipal ki fè w ap kite:</label>
                    <select id="primaryReason">
                        <option value="">Chwazi yon rezon...</option>
                        <option value="no_longer_needed">Mwen pa bezwen sèvis la ankò</option>
                        <option value="found_alternative">Mwen jwenn yon lòt platfòm</option>
                        <option value="too_expensive">Pri yo twò chè</option>
                        <option value="technical_issues">Twòp pwoblèm teknik</option>
                        <option value="privacy_concerns">Kè sote sou enfòmasyon pèsonèl</option>
                        <option value="other">Lòt rezon</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>2. Kòmantè sou eksperyans ou:</label>
                    <textarea id="experienceFeedback" placeholder="Ekri kòmantè ou isit la..." style="height: 50px;"></textarea>
                </div>

                <div class="form-group">
                    <label>3. Èske w ta rekòmande sèvis nou an bay yon zanmi?</label>
                    <div>
                        <label style="display:inline; margin-right: 15px;"><input type="radio" name="recommend" value="yes"> Wi</label>
                        <label style="display:inline; margin-right: 15px;"><input type="radio" name="recommend" value="maybe"> Petèt</label>
                        <label style="display:inline;"><input type="radio" name="recommend" value="no"> Non</label>
                    </div>
                </div>

                <button type="button" class="btn btn-danger" onclick="confirmAndDeleteAccount()">Konfime epi Siprime Kont la</button>
                <button type="button" class="btn btn-secondary" onclick="hideDeleteForm()" style="margin-top: 8px;">Anile</button>
            </div>

            <div style="margin-top: 20px;">
                <button type="button" class="btn btn-secondary" onclick="handleLogout()">Dekonekte</button>
            </div>
        </div>

    </div>

    <script>
        // Lè paj la chaje
        window.addEventListener('DOMContentLoaded', () => {
            // Ranpli imèl la otomatikman si l te memorize anvan (Lè l te dekonekte)
            const savedEmail = localStorage.getItem('rememberedEmail');
            if (savedEmail && document.getElementById('loginEmail')) {
                document.getElementById('loginEmail').value = savedEmail;
            }

            // Tcheke si yon itilizatè deja konekte
            checkAuthSession();
        });

        // 1. ANPECHE PLIZYÈ KONT AK MENM IMÈL LA (Sign Up)
        function handleRegister(event) {
            event.preventDefault();
            
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            
            let users = JSON.parse(localStorage.getItem('allUsers')) || [];
            
            // Tcheke si imèl la egziste deja nan baz done a
            const emailExists = users.some(user => user.email === email);
            
            if (emailExists) {
                alert('Imèl sa a deja itilize pa yon lòt kont. Tanpri itilize yon lòt imèl oswa konekte w.');
                return;
            }
            
            users.push({ name, email, password });
            localStorage.setItem('allUsers', JSON.stringify(users));
            
            alert('Kont ou an kreye avèk siksè! Ou kapab konekte kounye a.');
            document.getElementById('regEmail').value = '';
            document.getElementById('regPassword').value = '';
            document.getElementById('regName').value = '';
        }

        // Lojik pou Koneksyon (Login)
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            let users = JSON.parse(localStorage.getItem('allUsers')) || [];
            const validUser = users.find(u => u.email === email && u.password === password);

            if (validUser) {
                localStorage.setItem('currentUserEmail', email);
                localStorage.removeItem('rememberedEmail'); // Retire l nan memwa 'remembered' paske li konekte kounye a
                alert('Byenveni sou kont ou!');
                checkAuthSession();
            } else {
                alert('Imèl oswa modpas la pa kòrèk.');
            }
        }

        // Tcheke estati sesyon an pou montre/kache seksyon yo
        function checkAuthSession() {
            const currentEmail = localStorage.getItem('currentUserEmail');
            if (currentEmail) {
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('registerCard').style.display = 'none';
                document.getElementById('accountSettingsCard').style.display = 'block';
                loadAccountSettings(currentEmail);
            } else {
                document.getElementById('loginCard').style.display = 'block';
                document.getElementById('registerCard').style.display = 'block';
                document.getElementById('accountSettingsCard').style.display = 'none';
            }
        }

        // 2. JESYON DEKONEKSYON (Kenbe imèl, efase modpas)
        function handleLogout() {
            const currentEmail = localStorage.getItem('currentUserEmail');
            if (currentEmail) {
                localStorage.setItem('rememberedEmail', currentEmail);
            }
            
            localStorage.removeItem('currentUserEmail');
            sessionStorage.clear();
            
            checkAuthSession();
            
            // Mete imèl la nan chan login la ankò
            const savedEmail = localStorage.getItem('rememberedEmail');
            if (savedEmail && document.getElementById('loginEmail')) {
                document.getElementById('loginEmail').value = savedEmail;
            }
            alert('Ou dekonekte avèk siksè.');
        }

        // Chaje paramèt pwofil yo
        function loadAccountSettings(email) {
            let users = JSON.parse(localStorage.getItem('allUsers')) || [];
            let user = users.find(u => u.email === email);
            
            if (user && document.getElementById('updateName')) {
                document.getElementById('updateName').value = user.name || '';
                document.getElementById('updateEmail').value = user.email || '';
            }
        }

        // Edite enfòmasyon pèsonèl yo
        function saveProfileChanges() {
            const newName = document.getElementById('updateName').value.trim();
            const currentEmail = localStorage.getItem('currentUserEmail');
            
            let users = JSON.parse(localStorage.getItem('allUsers')) || [];
            let user = users.find(u => u.email === currentEmail);
            
            if (user) {
                user.name = newName;
                localStorage.setItem('allUsers', JSON.stringify(users));
                alert('Enfòmasyon ou yo mete ajou avèk siksè!');
            }
        }

        // Montre fòmilè kesyon sipresyon an
        function showDeleteForm() {
            document.getElementById('deleteReasonContainer').style.display = 'block';
        }

        // Kache fòmilè kesyon sipresyon an
        function hideDeleteForm() {
            document.getElementById('deleteReasonContainer').style.display = 'none';
        }

        // 3. SIPRESYON KONT AK KESYON REZON YO
        function confirmAndDeleteAccount() {
            const primaryReason = document.getElementById('primaryReason').value;
            
            if (!primaryReason) {
                alert('Tanpri chwazi omwen rezon prensipal ki fè w ap kite nou an.');
                return;
            }
            
            if (confirm('Èske ou sèten ou vle siprime kont ou a nèt? Aksyon sa a irévèrsibl.')) {
                const currentEmail = localStorage.getItem('currentUserEmail');
                
                // Ou ka itilize done sa yo si ou vle anrejistre feedback la nan yon log
                const feedbackData = {
                    email: currentEmail,
                    reason: primaryReason,
                    comment: document.getElementById('experienceFeedback').value,
                    recommend: document.querySelector('input[name="recommend"]:checked')?.value || 'none'
                };
                console.log('Done Sipresyon Kont:', feedbackData);
                
                let users = JSON.parse(localStorage.getItem('allUsers')) || [];
                users = users.filter(u => u.email !== currentEmail);
                
                localStorage.setItem('allUsers', JSON.stringify(users));
                
                // Netwaye sesyon an nèt
                localStorage.removeItem('currentUserEmail');
                localStorage.removeItem('rememberedEmail');
                
                alert('Kont ou an byen siprime. Mèsi!');
                checkAuthSession();
            }
        }
    </script>
</body>
</html>
