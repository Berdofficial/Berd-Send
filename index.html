<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BerdSend - Transfert d'Argent & Recharge Mobile</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .active-tab {
            border-bottom: 3px solid #2563eb;
            color: #2563eb;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- HEADER / NAVIGATION -->
    <header class="bg-white shadow-sm border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <!-- LOGO -->
            <div class="flex items-center gap-2">
                <img src="logo.jpg" alt="BerdSend Logo" class="h-10 w-auto object-contain" id="main-logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/120x40?text=BerdSend';">
            </div>
            
            <!-- AVATAR & LOGIN BUTTON -->
            <div class="flex items-center gap-3">
                <button class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-xl transition shadow-sm">
                    <i data-lucide="user" class="w-4 h-4"></i>
                    <span>Konekte (Login)</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="max-w-2xl mx-auto px-4 py-8 w-full flex-grow">
        
        <!-- CARD MAIN WRAPPER -->
        <div class="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
            
            <!-- SERVICES NAVIGATION TABS -->
            <div class="flex border-b border-slate-200 bg-slate-50/50">
                <button id="tab-transfer" onclick="switchService('transfer')" class="flex-1 py-4 text-center text-sm font-semibold flex items-center justify-center gap-2 active-tab transition">
                    <i data-lucide="send" class="w-4 h-4"></i>
                    <span>Transfè Lajan</span>
                </button>
                <button id="tab-recharge" onclick="switchService('recharge')" class="flex-1 py-4 text-center text-sm font-semibold text-slate-500 flex items-center justify-center gap-2 hover:text-blue-600 transition">
                    <i data-lucide="smartphone" class="w-4 h-4"></i>
                    <span>Rechaj Mobil</span>
                </button>
            </div>

            <div class="p-6 md:p-8">
                <!-- FORMULARIO DE TRANSACCIÓN -->
                <form id="payment-form" onsubmit="handleRedirectionPayment(event)">
                    
                    <!-- DYNAMIC SERVICE FIELDS -->
                    <div id="service-fields" class="space-y-4 mb-6">
                        <!-- Default: Transfer Fields -->
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Peyi Destinatè *</label>
                            <select class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-base bg-white">
                                <option value="HT">Haïti (HTG / USD)</option>
                                <option value="DR">République Dominicaine (DOP)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Montan pou voye (USD) *</label>
                            <input type="number" required min="1" placeholder="0.00" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-base">
                        </div>
                    </div>

                    <!-- MANDATORY EMAIL COLLECTION FOR TRANSACTION -->
                    <div class="mb-6">
                        <label class="block text-sm font-semibold text-slate-700 mb-1">
                            Adrès Email (Obligatwa pou resevwa resi a) *
                        </label>
                        <input type="email" id="customer-email" required placeholder="egzamp@gmail.com" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-base">
                    </div>

                    <div id="status-container" class="text-xs font-semibold mb-4"></div>

                    <!-- SUBMIT BUTTON (REDIRECT TO SQUARE CHECKOUT) -->
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl transition flex items-center justify-center gap-2">
                        <i data-lucide="external-link" class="w-5 h-5"></i>
                        <span>Peye ak Sekirite sou Square</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- REFERRAL PROGRAM BANNER (5$ PER INVITATION) -->
        <div class="mt-8 bg-gradient-to-r from-blue-500 to-indigo-600 rounded-2xl p-6 text-white shadow-md flex items-center justify-between">
            <div>
                <h3 class="font-bold text-lg mb-1">Envite yon zanmi, genyen $5!</h3>
                <p class="text-xs text-blue-100">W ap resevwa $5 pou chak envitasyon yon nouvo moun kòmanse sèvi ak BerdSend.</p>
            </div>
            <button class="bg-white text-blue-600 font-bold text-xs px-4 py-2.5 rounded-xl shadow hover:bg-slate-100 transition whitespace-nowrap">
                Pataje Lyen
            </button>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-500">
        <p>&copy; 2026 BerdSend LLC. Tout dwa rezève.</p>
    </footer>

    <!-- SCRIPT CONFIGURATION AND LOGIC -->
    <script>
        // INITIALIZE LUCIDE ICONS
        lucide.createIcons();

        // SWITCH TABS (TRANSFÈ VS RECHAJ)
        function switchService(service) {
            const tabTransfer = document.getElementById('tab-transfer');
            const tabRecharge = document.getElementById('tab-recharge');
            const serviceFields = document.getElementById('service-fields');

            if (service === 'transfer') {
                tabTransfer.className = "flex-1 py-4 text-center text-sm font-semibold flex items-center justify-center gap-2 active-tab transition";
                tabRecharge.className = "flex-1 py-4 text-center text-sm font-semibold text-slate-500 flex items-center justify-center gap-2 hover:text-blue-600 transition";
                
                serviceFields.innerHTML = `
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Peyi Destinatè *</label>
                        <select class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-base bg-white">
                            <option value="HT">Haïti (HTG / USD)</option>
                            <option value="DR">République Dominicaine (DOP)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Montan pou voye (USD) *</label>
                        <input type="number" required min="1" placeholder="0.00" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-base">
                    </div>
                `;
            } else {
                tabRecharge.className = "flex-1 py-4 text-center text-sm font-semibold text-slate-500 flex items-center justify-center gap-2 hover:text-blue-600 transition";
                tabTransfer.className = "flex-1 py-4 text-center text-sm font-semibold text-slate-500 flex items-center justify-center gap-2 hover:text-blue-600 transition";

                serviceFields.innerHTML = `
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Konpayi Telefòn *</label>
                        <select class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-base bg-white">
                            <option value="digicel">Digicel Haïti</option>
                            <option value="natcom">Natcom Haïti</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Nimewo Telefòn *</label>
                        <input type="tel" required placeholder="+509 XXXX XXXX" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-base">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Montan Rechaj ($) *</label>
                        <input type="number" required min="1" placeholder="5.00" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-base">
                    </div>
                `;
            }
            lucide.createIcons();
        }

        // HANDLE REDIRECT PAYMENT (SQUARE CHECKOUT)
        async function handleRedirectionPayment(event) {
            event.preventDefault();
            const statusContainer = document.getElementById('status-container');
            statusContainer.innerText = 'N ap prepare paj peman Square la...';
            statusContainer.className = 'text-xs font-semibold text-blue-600';

            // Isit la fòm nan ap rele API backend ou an (API Route / Vercel Serverless Function)
            // Backend sa a ap kreye yon "Checkout Link" ak Square Checkout API lè l sèvi ak Access Token ou an.
            
            // Pa egzanp:
            // const response = await fetch('/api/create-checkout', { method: 'POST', body: ... });
            // const data = await response.json();
            // window.location.href = data.checkoutUrl;
        }
    </script>
</body>
</html>
