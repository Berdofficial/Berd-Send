<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BerdSend - Transfè ak Rechaj</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 20px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-pay {
            width: 100%;
            padding: 12px;
            background-color: #6772e5;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .btn-pay:hover {
            background-color: #5469d4;
        }
        .footer-note {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>BerdSend - Peman Rechaj</h2>
        <form id="usRechargeForm" onsubmit="processUSPayment(event)">
            <label for="usPhone">Nimewo pou resevwa rechaj la:</label>
            <input type="text" id="usPhone" placeholder="Egzanp: +1 (555) 000-0000" required>

            <label for="rechargeAmount">Chwazi Pake / Kantite Lajan:</label>
            <select id="rechargeAmount" required>
                <option value="">-- Chwazi yon opsyon --</option>
                <option value="link_10">$10 - Rechaj</option>
                <option value="link_20">$20 - Rechaj</option>
                <option value="link_50">$50 - Rechaj</option>
            </select>

            <button type="submit" class="btn-pay">Peye ak Kat Kredi (Stripe)</button>
        </form>
        <div class="footer-note">Peman an sekirize atravè Stripe pou kliyan Ozetazini.</div>
    </div>

    <script>
        function processUSPayment(event) {
            event.preventDefault(); // Anpeche paj la rafrechi oswa vin blan

            let phone = document.getElementById('usPhone').value;
            let option = document.getElementById('rechargeAmount').value;

            if (!phone || !option) {
                alert("Tanpri ranpli tout enfòmasyon yo.");
                return;
            }

            // Lyen Stripe Live yo pou kliyan Etazini yo (Rete pou mete vre lyen ou yo la a)
            let stripeLinks = {
                "link_10": "https://buy.stripe.com/ANTAN_VRE_LYEN_10$_LA",
                "link_20": "https://buy.stripe.com/ANTAN_VRE_LYEN_20$_LA",
                "link_50": "https://buy.stripe.com/ANTAN_VRE_LYEN_50$_LA"
            };

            let targetLink = stripeLinks[option];

            if (targetLink && targetLink.includes("buy.stripe.com")) {
                // Louvri paj peman Stripe la nan yon nouvo onglet yon fason ki pwòp
                window.open(targetLink, '_blank');
            } else {
                alert("Erè: Lyen peman pou opsyon sa a poko mete kòrèkteman nan sistèm nan.");
            }
        }
    </script>

</body>
</html>
