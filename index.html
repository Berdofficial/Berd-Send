<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BerdSend - Rechaj Mobil Enternasyonal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #1e293b, #0f172a);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .glass-header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="text-slate-800 font-sans min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

  <!-- BANNYÈ PWOMOSYON -->
  <div id="promoBanner" class="bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-600 text-white text-[11px] sm:text-sm font-medium py-2 px-3 text-center relative flex justify-center items-center gap-1.5 shadow-md">
    <span>🎁 <strong>Nouvo Kliyan!</strong> Resevwa $5 USD bonus sou balans ou apre premye rechaj ou!</span>
    <button onclick="document.getElementById('promoBanner').remove()" class="ml-2 text-white/80 hover:text-white font-bold">&times;</button>
  </div>

  <!-- HEADER -->
  <header class="glass-header sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-2.5 sm:px-4 h-16 flex items-center justify-between gap-1 sm:gap-4">
      <a href="index.html" class="flex items-center gap-1.5 sm:gap-3 shrink-0">
        <img src="logo.jpg" alt="BerdSend Logo" class="h-8 w-8 sm:h-10 sm:w-10 rounded-xl object-cover border border-white/20 shadow-sm" onerror="this.style.display='none'">
        <span class="text-lg sm:text-2xl font-black text-white tracking-tight">Berd<span class="text-blue-400">Send</span></span>
      </a>

      <div class="flex items-center gap-1.5 sm:gap-3">
        <select id="languageSelect" class="bg-slate-800/80 border border-slate-700 text-white rounded-xl text-[11px] sm:text-xs font-semibold px-1.5 sm:px-2 py-1 sm:py-1.5 focus:outline-none cursor-pointer">
          <option value="ht">🇭🇹 Haitian Creole</option>
          <option value="en">🇺🇸 English</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="es">🇪🇸 Español</option>
        </select>
      </div>
    </div>
  </header>

  <!-- KONTNI PWINSIPAL -->
  <main class="max-w-xl mx-auto px-4 py-8 w-full flex-grow">
    <div class="glass-card p-6 rounded-3xl shadow-2xl space-y-6">
      
      <!-- PEYI DESTINASYON -->
      <div>
        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Peyi Destinasyon Rechaj la</label>
        <select id="countrySelect" onchange="onCountryChange(this.value)" class="w-full p-3 rounded-xl border border-slate-300 font-semibold text-sm bg-white/90 focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="">Chwazi yon peyi destinasyon...</option>
        </select>
      </div>

      <!-- NIMOWO TELEFÒN -->
      <div>
        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Nimewo Telefòn Moun k ap Resevwa a</label>
        <div class="flex gap-2">
          <span id="phoneCodeBadge" class="p-3 bg-slate-200/90 border border-slate-300 rounded-xl font-bold text-slate-800 text-sm flex items-center min-w-[70px] justify-center shadow-inner">
            +---
          </span>
          <input type="tel" id="phoneNumber" placeholder="Ekz: 37001234" class="w-full p-3 rounded-xl border border-slate-300 font-semibold text-sm bg-white/90 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <!-- MONTAN -->
      <div>
        <label class="block text-xs font-bold uppercase text-slate-600 mb-2">Montan Rechaj (USD)</label>
        <div id="amountButtonsContainer" class="grid grid-cols-3 gap-2 mb-3"></div>

        <div class="mt-2">
          <input type="number" id="customAmount" placeholder="Antre yon montan pèsonalize (Min $5, Max $50)" min="5" max="50" oninput="handleCustomAmount()" class="w-full p-3 rounded-xl border border-slate-300 font-semibold text-sm bg-white/90 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <!-- REZIME PEYMAN -->
      <div class="border-t border-slate-200 pt-4 space-y-2">
        <div class="flex justify-between text-xs font-semibold text-slate-600">
          <span>Montan Rechaj:</span>
          <span id="summarySubtotal">$0.00 USD</span>
        </div>
        <div class="flex justify-between text-xs font-semibold text-slate-600">
          <span>Frè Sèvis:</span>
          <span id="summaryFee">$0.00 USD</span>
        </div>

        <div class="flex justify-between text-sm font-black text-slate-900 pt-1 border-t border-slate-200">
          <span>Total pou Peye:</span>
          <span id="summaryTotal" class="text-blue-600 text-base">$0.00 USD</span>
        </div>

        <button type="button" onclick="processPaymentWithAPI()" id="btnPay" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-base rounded-2xl shadow-xl shadow-emerald-600/30 transition mt-4 flex items-center justify-center gap-2 cursor-pointer">
          <i class="fa-solid fa-lock"></i> <span>Peye & Voye Rechaj Kounye A</span>
        </button>
      </div>

    </div>
  </main>

  <footer class="bg-slate-950 text-slate-400 py-6 text-center text-xs">
    &copy; 2026 BerdSend LLC. Tout dwa rezeve.
  </footer>

  <script>
    const reloadlyCountries = [
      { code: "HT", name: "Ayiti (Haiti)", dialCode: "+509" },
      { code: "DO", name: "Repiblik Dominiken", dialCode: "+1" },
      { code: "JM", name: "Jamayik", dialCode: "+1" },
      { code: "CU", name: "Kiba", dialCode: "+53" },
      { code: "US", name: "Etazini", dialCode: "+1" },
      { code: "CA", name: "Kanada", dialCode: "+1" },
      { code: "BR", name: "Brezil", dialCode: "+55" },
      { code: "MX", name: "Meksik", dialCode: "+52" },
      { code: "FR", name: "Frans", dialCode: "+33" },
      { code: "ES", name: "Espay", dialCode: "+34" }
    ];

    const validAmountsUSD = [5, 15, 20, 25, 30, 35, 40, 45, 50];
    let selectedAmountUSD = 0;
    let selectedFeeUSD = 0;
    let selectedCountryCode = "";

    function populateDestinationCountries() {
      const select = document.getElementById('countrySelect');
      reloadlyCountries.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.code;
        opt.textContent = `${c.name} (${c.dialCode})`;
        select.appendChild(opt);
      });
    }

    function onCountryChange(countryCode) {
      selectedCountryCode = countryCode;
      const country = reloadlyCountries.find(c => c.code === countryCode);
      document.getElementById('phoneCodeBadge').textContent = country ? country.dialCode : "+---";
    }

    function loadAmountButtons() {
      const container = document.getElementById('amountButtonsContainer');
      container.innerHTML = '';
      validAmountsUSD.forEach((amt) => {
        const fee = calculateFee(amt);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'amount-btn p-3 rounded-2xl border border-slate-200 bg-white hover:border-blue-500 flex flex-col items-center justify-center transition shadow-sm';
        btn.innerHTML = `<span class="text-sm font-extrabold text-slate-900">$${amt} USD</span><span class="text-[10px] font-bold text-slate-400">+ $${fee} frè</span>`;
        btn.onclick = () => selectFixedAmount(amt, fee, btn);
        container.appendChild(btn);
      });
    }

    function calculateFee(amountUSD) {
      if (!amountUSD || amountUSD <= 0) return 0;
      let fee = amountUSD * 0.10;
      if (fee < 0.65) fee = 0.65;
      if (fee > 5.00) fee = 5.00;
      return parseFloat(fee.toFixed(2));
    }

    function selectFixedAmount(amt, fee, btnElement) {
      document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('border-blue-600', 'bg-blue-50', 'ring-2', 'ring-blue-500/20'));
      if (btnElement) btnElement.classList.add('border-blue-600', 'bg-blue-50', 'ring-2', 'ring-blue-500/20');
      document.getElementById('customAmount').value = '';
      selectedAmountUSD = amt;
      selectedFeeUSD = fee;
      updateSummaryDisplay();
    }

    function handleCustomAmount() {
      document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('border-blue-600', 'bg-blue-50', 'ring-2', 'ring-blue-500/20'));
      const val = parseFloat(document.getElementById('customAmount').value);
      selectedAmountUSD = val || 0;
      selectedFeeUSD = calculateFee(selectedAmountUSD);
      updateSummaryDisplay();
    }

    function updateSummaryDisplay() {
      document.getElementById('summarySubtotal').textContent = `$${selectedAmountUSD.toFixed(2)} USD`;
      document.getElementById('summaryFee').textContent = `$${selectedFeeUSD.toFixed(2)} USD`;
      document.getElementById('summaryTotal').textContent = `$${(selectedAmountUSD + selectedFeeUSD).toFixed(2)} USD`;
    }

    // APÈL SOUMISYON BAY API VERCEL LA
    async function processPaymentWithAPI() {
      const phoneInput = document.getElementById('phoneNumber').value.trim();
      if (!selectedCountryCode || !phoneInput || selectedAmountUSD <= 0) {
        alert("Tanpri ranpli tout enfòmasyon yo byen (Peyi, Telefòn, Montan).");
        return;
      }

      const btnPay = document.getElementById('btnPay');
      btnPay.disabled = true;
      btnPay.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> N ap kòmande peyman an...`;

      const countryObj = reloadlyCountries.find(c => c.code === selectedCountryCode);
      const fullPhone = countryObj.dialCode + phoneInput.replace(/\D/g, '');
      const totalUSD = (selectedAmountUSD + selectedFeeUSD).toFixed(2);

      try {
        // Nou voye done yo nan API Vercel la
        const response = await fetch('/api/pay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: fullPhone,
            countryCode: selectedCountryCode,
            amountUSD: selectedAmountUSD,
            feeUSD: selectedFeeUSD,
            totalUSD: totalUSD
          })
        });

        const result = await response.json();

        // Si Vercel ak Square retounen yon lyen dinamik ak montan fiks la
        if (result.checkoutUrl || result.url) {
          window.location.href = result.checkoutUrl || result.url;
        } else {
          alert(result.message || "Echèk nan kreyasyon tranzaksyon an. Tanpri re-eseye.");
        }
      } catch (err) {
        console.error("Erè API:", err);
        alert("Gen yon ti pwoblèm rezo oswa API. Tanpri re-eseye.");
      }

      btnPay.disabled = false;
      btnPay.innerHTML = `<i class="fa-solid fa-lock"></i> Peye & Voye Rechaj Kounye A`;
    }

    window.onload = () => {
      populateDestinationCountries();
      loadAmountButtons();
    };
  </script>
</body>
</html>
