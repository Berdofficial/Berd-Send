<div style="max-width: 400px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
  <h2>Voye Rechaj ak BerdSend</h2>
  <form id="topupForm">
    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px;">Nimewo Telefòn (avèk kòd peyi):</label>
      <input type="text" id="phone" placeholder="+509XXXXXXXX" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>
    
    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px;">ID Operatè a (Operator ID):</label>
      <input type="number" id="operatorId" placeholder="Egzanp: 15 (Digicel/Natcom)" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px;">Kantite lajan ($):</label>
      <input type="number" id="amount" placeholder="5" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <button type="submit" style="width: 100%; padding: 10px; background: #0070f3; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Fè Rechaj la</button>
  </form>
  <p id="resultMsg" style="margin-top: 15px; font-weight: bold; text-align: center;"></p>
</div>

<script>
  document.getElementById('topupForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const msg = document.getElementById('resultMsg');
    msg.style.color = "#000";
    msg.textContent = "Ap voye tranzaksyon an...";

    const recipientPhone = document.getElementById('phone').value;
    const operatorId = document.getElementById('operatorId').value;
    const amount = document.getElementById('amount').value;

    try {
      const response = await fetch('/api/reloadly', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ recipientPhone, operatorId, amount })
      });

      const data = await response.json();
      
      if (response.ok) {
        msg.style.color = "green";
        msg.textContent = "Siksè! Tranzaksyon an pase. ID Tranzaksyon: " + (data.transactionId || 'Oke');
      } else {
        msg.style.color = "red";
        msg.textContent = "Erè: " + (data.error || 'Yon bagay ale mal');
      }
    } catch (err) {
      msg.style.color = "red";
      msg.textContent = "Erè koneksyon: " + err.message;
    }
  });
</script>
